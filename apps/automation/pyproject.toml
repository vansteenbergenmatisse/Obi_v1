[project]
name = "omniboost-rag-automation"
dynamic = ["version"]
description = "Confluence-native RAG automation service: sync, ingestion, retrieval, RAG agent, evals"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.380",
]
# Accurate OpenAI token counting for chunk sizing (falls back to a heuristic when absent).
tokenizers = ["tiktoken>=0.8"]
# Native attachment parsers; lazily imported, degrade to "skipped" when not installed.
attachments = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1"]
# Local embedding provider (EMBEDDING_PROVIDER=local); large download on first use.
local-embeddings = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app", "tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
