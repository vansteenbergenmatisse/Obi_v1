[project]
name = "omniboost-rag-automation"
dynamic = ["version"]
description = "Confluence-native RAG automation service: sync, ingestion, retrieval, RAG agent, evals"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pyjwt[crypto]>=2.14.0",
    # tiktoken is a core dependency: chunk sizing is defined in tokens and the regression suite
    # asserts exact token counts, so accurate counting must be present in prod and CI — not optional.
    # (Was the optional `tokenizers` extra; the 0.5.1 Makefile/CI split dropped `--extra tokenizers`,
    # so a fresh env like CI fell back to the char heuristic and 4 chunk tests failed.)
    "tiktoken>=0.8",
    # The knowledge-base schema package (models, roles, policies, DB settings). Imported as
    # `schema`; lives in ../knowledge-base as an editable workspace-style path dep (1.1.1 move).
    "obi-knowledge-base",
]

[tool.uv.sources]
obi-knowledge-base = { path = "../knowledge-base", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.380",
    # tools/brief.py parses the design HTML into the markdown brief.
    "beautifulsoup4>=4.12",
]
# tiktoken is now a core dependency (see [project].dependencies); this extra is retained, redundant
# but harmless, so the documented `--extra tokenizers` command keeps working.
tokenizers = ["tiktoken>=0.8"]
# Native attachment parsers; lazily imported, degrade to "skipped" when not installed.
attachments = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1"]
# Local embedding provider (EMBEDDING_PROVIDER=local); large download on first use.
local-embeddings = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `schema` is the knowledge-base package (an editable local dependency, ../knowledge-base). Pin it
# first-party alongside `app` so its imports stay grouped with app imports rather than drifting into
# the third-party block after the 1.1.1 move (the old db-layer import path became `schema.*`).
known-first-party = ["app", "schema"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app", "tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers"
markers = [
    "db: requires a real local Postgres with migrations applied (substep 0.5.1, harness.md)",
]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
