# Obi's four commit-gating levels (substep 0.5.1, docs/Final_docs/0.5-regression-tests/harness.md).
# One job, four steps that mirror the root Makefile's test-unit / test-db / test-ui / eval targets
# exactly, plus a coverage-floor guard. Runs on every pull request, to any branch — there was no
# CI in this repo before this substep; GitHub Actions is the default absent a competing tool.
name: CI

on:
  pull_request:

jobs:
  obi-checks:
    name: obi four-level check (0.5.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"

      - name: Set up the automation venv (README Quickstart)
        run: cd backend && uv venv --python 3.12 && uv pip install -e ".[dev]"

      # The knowledge base owns its own standalone test suite (1.1.1-fix): its schema/migration
      # tests import nothing from the backend, so they run from their own venv. Installed here so
      # the coverage floor and make test-unit/test-db can collect and run them.
      - name: Set up the knowledge-base venv (1.1.1-fix)
        run: cd knowledge-base && uv venv --python 3.12 && uv pip install -e ".[dev]"

      # The coverage floor from harness.md: pytest must collect at least this many tests
      # (test-unit + test-db combined). A drop below it means a test file silently stopped
      # being collected (e.g. a marker typo, since --strict-markers only catches unknown
      # marks, not missing ones). 1.1.1-fix: the ~35 schema/migration tests moved from
      # backend/ to knowledge-base/, so the floor now sums BOTH trees — otherwise a deletion
      # in either tree could hide below the other's margin (a false pass), and the split alone
      # would drop the backend-only count below the floor (a false fail). The combined total is
      # unchanged by the move; the floor of 625 stays the same minimum it was at substep 0.5.1.
      - name: Coverage floor (>= 625 tests collected, backend + knowledge-base)
        run: |
          count_backend=$(cd backend && uv run pytest --collect-only -q | tail -1 | grep -oE '^[0-9]+')
          count_kb=$(cd knowledge-base && uv run pytest --collect-only -q | tail -1 | grep -oE '^[0-9]+')
          count_backend=${count_backend:-0}
          count_kb=${count_kb:-0}
          count=$((count_backend + count_kb))
          echo "pytest collected: backend=$count_backend + knowledge-base=$count_kb = $count"
          if [ "$count" -lt 625 ]; then
            echo "::error::pytest collected $count tests (backend=$count_backend, knowledge-base=$count_kb), below the substep 0.5.1 coverage floor of 625 (harness.md)"
            exit 1
          fi

      - name: make test-unit
        run: make test-unit

      - name: make test-db
        run: make test-db

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: make test-ui
        run: make test-ui

      - name: make eval
        run: make eval
