services:
  postgres:
    # pgvector 0.8.5 on Postgres 16. 0.8+ is REQUIRED for hnsw.iterative_scan, the safety
    # valve that stops a narrow RLS/source scope from silently under-returning HNSW rows
    # (ADR-0004; PLAN.md 3.5.1). Pinned by digest because the rolling :pg16 tag drifts
    # across pgvector versions — reproducibility beats "latest". Digest verified = 0.8.5.
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    container_name: omniboost_rag_pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: omniboost_rag
    ports:
      # host 5434 -> container 5432 (avoids clashing with local pg / other containers)
      - "5434:5432"
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d omniboost_rag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rag_pg_data:
