services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omniboost_rag_pg
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: omniboost_rag
    ports:
      # host 5434 -> container 5432 (avoids clashing with local pg / other containers)
      - "5434:5432"
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d omniboost_rag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rag_pg_data:
