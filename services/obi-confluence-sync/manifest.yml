# Obi · Confluence → backend webhook bridge (Atlassian Forge app).
#
# Confluence Cloud has no native outgoing webhooks (no admin UI; the /rest/webhooks/1.0 API is
# unsupported internal; Connect private-app installs closed March 2026; Confluence Automation
# cannot compute an HMAC header). This Forge app is the sanctioned delivery path: it subscribes
# to the page + label product events and forwards each as a signed POST to the deployed backend's
# `POST /confluence/events` (see backend/app/features/confluence_sync/server/webhook.py and
# docs/Final_docs/ingestion/webhook.md for the receiver contract).
#
# Scopes: read:confluence-content.summary covers the page events; label events add
# read:confluence-space.summary; the events reference lists write:confluence-content as required
# to SUBSCRIBE to trashed/deleted page events (the app itself never writes to Confluence).
#
# Egress: only the Railway backend domain is declared — Forge blocks all other outbound hosts.
#
# app.id is written by `forge register` (run once; never re-run — it disconnects environments,
# variables and storage). See docs/runbooks/obi-confluence-sync-deploy.md.

app:
  id: ari:cloud:ecosystem::app/b36e7d9d-5117-4f7e-a49e-fcdb6ca19118
  runtime:
    name: nodejs22.x

modules:
  trigger:
    - key: obi-confluence-event-bridge
      function: main
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page
        - avi:confluence:moved:page
        - avi:confluence:trashed:page
        - avi:confluence:restored:page
        - avi:confluence:deleted:page
        - avi:confluence:added:label
        - avi:confluence:removed:label
  function:
    - key: main
      handler: index.handleEvent

permissions:
  scopes:
    - read:confluence-content.summary
    - read:confluence-space.summary
    - write:confluence-content
  external:
    fetch:
      backend:
        - address: obi-backend-production.up.railway.app
