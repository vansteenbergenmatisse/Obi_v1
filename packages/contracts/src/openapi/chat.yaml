openapi: 3.1.0
info:
  title: Omniboost RAG API
  version: 0.1.0
  description: >
    Source-of-truth contract for the Omniboost RAG chat API and the inbound
    Confluence webhook envelope. TypeScript types under `src/index.ts` are
    hand-written to match this document until a generator is wired up; a
    Pydantic sibling is not needed today because `backend`'s FastAPI
    route already defines its own Pydantic body models directly (PLAN 4.4).
    The streaming runtime is implemented (PLAN 4.4/4.5): `POST /chat` streams
    a real answer and `PATCH /chat/{traceId}/feedback` records a rating.
servers:
  - url: http://localhost:8000
    description: Local automation API (FastAPI)

paths:
  /chat:
    post:
      operationId: postChat
      summary: Ask a question and stream back an answer with citations.
      description: >
        Accepts a user message (optionally continuing an existing
        conversation) and returns a Server-Sent Events stream. Each SSE `data:`
        line is a JSON `ChatStreamEvent`: a single `start` (with the
        conversationId), zero or more `token` deltas, a `citations` event, and
        a terminal `done` or `error`.

        Integration context (§D.13, substep 8.1.2): access is decided by the
        verified embed token (see `token-claims.json`), never by this body. A
        verified token whose FILLED POS or PMS slot holds a catalog product
        outside the launch allowlist (Toast as POS, Mews as PMS) is refused
        service — Obi stays hidden for that company and the backend gate
        refuses the session too (the frontend hiding is UX, not the boundary).
        An empty slot never triggers this refusal. Enforced at the gate
        (substep 8.1.3); documented here as the contract.

        Directed connection (substep 9.3.1, ADR-0020 Option A): the token MAY
        instead carry a directed `source_system` → `target_system` +
        `business_id` connection (see `token-claims.json`), which is what routes
        going forward; the slot and legacy forms stay accepted but no longer
        route. The gate resolves both systems against the product catalog and
        refuses an unknown source or target with a 400 before any search; the
        body never decides the connection (never-bend rules 2-3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: An SSE stream of chat events.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "400":
          description: >
            Malformed request body, empty/oversized history, or history not
            ending on a user turn. Also the fail-closed answer for an unknown
            integration value: a verified-token slot (or legacy integration)
            value that resolves to no product in the catalog, a verified-token
            directed `source_system`/`target_system` that resolves to no product
            (substep 9.3.1) is a 400 before any search ever runs (§D.11;
            token-side enforcement lands at the gate, substeps 8.1.3 / 9.3.1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Chat API key not configured server-side (fail-closed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chat/{traceId}/feedback:
    patch:
      operationId: patchChatFeedback
      summary: Record thumbs up/down feedback for a completed chat turn.
      description: >
        Updates the `query_trace` row identified by `traceId` (returned on the
        stream's `done` event) with a `1` (up) or `-1` (down) rating.
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: Feedback recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
        "400":
          description: Malformed feedback value (must be -1 or 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /confluence/events:
    post:
      operationId: postConfluenceEvent
      summary: Receive a Confluence webhook delivery.
      description: >
        Inbound webhook endpoint. Deliveries are authenticated out-of-band
        (HMAC shared secret) and processed idempotently by `deliveryId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfluenceEventEnvelope"
      responses:
        "202":
          description: Delivery accepted and queued for processing.
        "400":
          description: Malformed or unauthenticated delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    ImageAttachment:
      type: object
      required:
        - mediaType
        - data
      description: >
        An inline image attached to a chat turn (ADR-0009). Per decision 2,
        the web client only ever puts this on the newest turn when resending
        history; the backend does not enforce that shape structurally.
      properties:
        mediaType:
          type: string
          description: MIME type of the image, e.g. image/png.
        data:
          type: string
          description: Base64-encoded image bytes (no data URI prefix).

    ChatTurn:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
        images:
          type: array
          items:
            $ref: "#/components/schemas/ImageAttachment"
          description: >
            Images attached to this turn (ADR-0009). Sent through a second,
            independent vision-analysis call, never through citation
            enforcement (decision 4).

    ChatRequest:
      type: object
      required:
        - history
      properties:
        conversationId:
          type: string
          description: Existing conversation to continue. Omit to start a new one.
        history:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatTurn"
          description: >
            Full turn history for this conversation, oldest first, ending on a
            user turn. The server is stateless per request — the caller resends
            the whole history on every call (PLAN 4.4 design decision 2).
        principal:
          type: string
          description: >
            Caller-self-reported principal id used for page-level ACL scoping.
            Trusted only as far as the deployment trusts the calling web proxy
            (ADR-0004) — absent/unverified never widens access.
        simulatedContext:
          $ref: "#/components/schemas/SimulatedContext"
          description: >
            DEV / STANDALONE-HARNESS ONLY, non-authoritative (panel mi-contract,
            substep 8.4.2). The simulated integration context chosen in the
            standalone preset selector (company_id + the three §D.13 slots).
            NEVER set in a real customer session and NEVER decides access — the
            verified token/note is the only authority (never-bend rules 2–3;
            the integration context comes only from the verified token). The
            backend accepts the shape so the dev harness does not 400, then
            logs and ignores it in favour of the token.

    SimulatedContext:
      type: object
      required:
        - companyId
        - slots
      properties:
        companyId:
          type: string
          description: The pretend company id (a preset-* id in the committed standalone preset list).
        slots:
          type: object
          required:
            - pos
            - pms
            - accounting
          properties:
            pos:
              type: string
              nullable: true
            pms:
              type: string
              nullable: true
            accounting:
              type: string
              nullable: true
          description: >
            The three §D.13 slots — each a canonical product id from
            product_catalog.json, or null when empty.

    Citation:
      type: object
      required:
        - id
        - pageId
        - title
        - url
      properties:
        id:
          type: string
        pageId:
          type: string
        title:
          type: string
        url:
          type: string
        version:
          type: integer
          minimum: 1
          description: Not currently populated by the retrieval pipeline; reserved for a future page-version join.
        snippet:
          type: string
        attribution:
          type: string
          enum: [general, pos, pms, accounting, pair, connection]
          description: >
            Why this source was eligible for THIS customer (§D.13 keuze 3,
            panel mi-attrib): a general guide, a guide admitted by one named
            filled slot (pos / pms / accounting), a guide for a slot pair the
            company actually has, or `connection` — the directed source → target
            connection box this chat is bound to (substep 9.3.1, ADR-0020 Option
            A). Optional — absent until the backend assembles attribution
            (substep 8.3.4); the field never carries anything beyond the
            customer's own verified context.

    ChatStartEvent:
      type: object
      required: [type, conversationId]
      properties:
        type:
          type: string
          const: start
        conversationId:
          type: string

    ChatTokenEvent:
      type: object
      required: [type, delta]
      properties:
        type:
          type: string
          const: token
        delta:
          type: string

    ChatCitationsEvent:
      type: object
      required: [type, citations]
      properties:
        type:
          type: string
          const: citations
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"

    ChatDoneEvent:
      type: object
      required: [type, answer, citations, refused]
      properties:
        type:
          type: string
          const: done
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        traceId:
          type: ["string", "null"]
          description: >
            Links to the `query_trace` row for `PATCH /chat/{traceId}/feedback`.
            Null only if the trace write itself failed (documented edge case,
            not a bypass — feedback is simply unavailable for that turn).
        refused:
          type: boolean
          description: True when the pipeline refused below `refusal_min_rerank_score`; the UI should route to a human instead of treating `answer` as grounded.
        imageAnalysis:
          type: ["string", "null"]
          description: >
            Vision-analysis text for any images on the turn (ADR-0009
            decision 5), appended after the grounded answer as its own
            labeled block. Absent/null when the turn had no image.
        needsClarification:
          type: boolean
          description: >
            True when the query was judged too vague to search well
            (PLAN 9.3, ADR-0008 decision 3) and the pipeline bypassed
            rewrite/retrieval/refusal to ask a clarifying question instead.
            A still-open conversation turn, not a refusal — `refused` stays
            false on this path. Absent/false before the backend implements
            9.3.
        clarificationQuestion:
          type: ["string", "null"]
          description: >
            The clarifying question, identical to `answer` on this path —
            present as its own field so a client can distinguish a
            clarification turn without string-matching `answer`.
        clarificationOptions:
          type: ["array", "null"]
          items:
            type: string
          description: >
            2-4 concrete options the clarifying question offers, for a
            client to render as quick-reply chips (PLAN 9.5). Absent/null
            when the turn is not a clarification turn.

    ChatErrorEvent:
      type: object
      required: [type, error]
      properties:
        type:
          type: string
          const: error
        error:
          type: string

    ChatStreamEvent:
      oneOf:
        - $ref: "#/components/schemas/ChatStartEvent"
        - $ref: "#/components/schemas/ChatTokenEvent"
        - $ref: "#/components/schemas/ChatCitationsEvent"
        - $ref: "#/components/schemas/ChatDoneEvent"
        - $ref: "#/components/schemas/ChatErrorEvent"
      discriminator:
        propertyName: type

    ConfluenceEventEnvelope:
      type: object
      required:
        - eventType
        - pageId
        - version
        - spaceId
        - status
        - timestamp
        - deliveryId
      properties:
        eventType:
          type: string
          enum: [page_created, page_updated, page_removed, page_restored]
        pageId:
          type: string
        version:
          type: integer
          minimum: 1
        spaceId:
          type: string
        status:
          type: string
          enum: [current, draft, trashed, historical]
        timestamp:
          type: string
          format: date-time
        deliveryId:
          type: string
          description: Unique delivery id used for idempotent processing.

    FeedbackRequest:
      type: object
      required:
        - feedback
      properties:
        feedback:
          type: integer
          enum: [-1, 1]
          description: Thumbs down (-1) or thumbs up (1).

    FeedbackResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
